<form method="post" action="{{ url_for('admin.vocabulary_save') }}" class="pad">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  {% if vocab %}<input type="hidden" name="id" value="{{ vocab.id }}">{% endif %}
  <div class="field"><label>Name</label><input type="text" name="name" value="{{ vocab.name if vocab else '' }}" required></div>
  <div class="field"><label>Description</label><input type="text" name="description" value="{{ vocab.description if vocab else '' }}"></div>
  <div class="field"><label>Values (one per line)</label><textarea name="terms" rows="5">{% if vocab %}{{ vocab.terms|map(attribute='value')|join('\n') }}{% endif %}</textarea></div>
  <div class="modal-actions">
    {% if vocab %}<button class="btn btn-ghost btn-danger-text" name="action" value="delete" formnovalidate>Delete</button>{% endif %}
    <button class="btn btn-primary btn-sm">Save vocabulary</button>
  </div>
</form>
