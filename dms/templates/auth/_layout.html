<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} · {{ app_name }}</title>
  <link rel="icon" href="{{ url_for('static', filename='img/logo.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="auth-body">
  <main class="auth-wrap">
    <div class="auth-brand">
      <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="" width="36" height="36">
      <span>{{ app_name }}</span>
    </div>
    <div class="card auth-card">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="notice notice-{{ 'error' if category == 'error' else 'info' }}"><div>{{ message }}</div></div>
        {% endfor %}
      {% endwith %}
      {% block content %}{% endblock %}
    </div>
  </main>
</body>
</html>
