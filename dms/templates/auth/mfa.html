{% extends "auth/_layout.html" %}
{% block title %}Verification{% endblock %}
{% block content %}
<h1>Two-step verification</h1>
<p class="muted">Enter the 6-digit code from your authenticator app for <strong>{{ user.label }}</strong>, or one of your recovery codes.</p>
{% if error %}<div class="notice notice-error"><div>{{ error }}</div></div>{% endif %}
<form method="post" action="{{ url_for('auth.mfa') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="field">
    <label for="code">Verification code</label>
    <input type="text" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" required autofocus maxlength="20">
  </div>
  <button type="submit" class="btn btn-primary btn-block">Verify</button>
</form>
<form method="post" action="{{ url_for('auth.logout') }}" class="center" style="margin-top:12px">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <button type="submit" class="btn btn-ghost btn-sm">Cancel and sign out</button>
</form>
{% endblock %}
